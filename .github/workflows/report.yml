name: Generate effort reports

on:
  schedule:
    - cron: '17 23 * * 1'
      timezone: Europe/Berlin
  workflow_dispatch:
    inputs:
      owner:
        description: Source organization
        default: idle-arcade
        type: string
      project:
        description: Source project number
        default: '1'
        type: string
      sprint:
        description: Optional Sprint iteration ID (empty = all project effort)
        type: string

      gource_preview:
        description: Generate experimental Gource still (no video)
        type: boolean
        default: false
      source_ref:
        description: Game repository branch, tag, or commit for the repository maps
        type: string
        default: main

permissions:
  contents: write

concurrency:
  group: charts-publish
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Fetch, validate and render
        env:
          SOURCE_TOKEN: ${{ secrets.SOURCE_TOKEN }}
          SOURCE_OWNER: ${{ inputs.owner || 'idle-arcade' }}
          SOURCE_PROJECT: ${{ inputs.project || '1' }}
          SOURCE_SPRINT: ${{ inputs.sprint }}
        shell: bash
        run: |
          if [ -z "$SOURCE_TOKEN" ]; then
            echo '::error::Add the SOURCE_TOKEN Actions secret with source Projects/Issues read access.'
            exit 1
          fi
          args=(generate --owner "$SOURCE_OWNER" --project "$SOURCE_PROJECT")
          if [ -n "$SOURCE_SPRINT" ]; then args+=(--sprint "$SOURCE_SPRINT"); fi
          npm run report -- "${args[@]}"
      - name: Check out game for repository visualizations
        uses: actions/checkout@v5
        with:
          repository: idle-arcade/game
          ref: ${{ inputs.source_ref || 'main' }}
          path: .work/game
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare a filtered visualization checkout
        shell: bash
        run: |
          mkdir -p reports/repository
          git clone --no-hardlinks .work/game .work/idle-arcade
          git -C .work/idle-arcade rm -r --ignore-unmatch -- \
            node_modules dist build out .next package-lock.json yarn.lock pnpm-lock.yaml \
            ':(glob)**/package-lock.json' ':(glob)**/yarn.lock' ':(glob)**/pnpm-lock.yaml' \
            ':(glob)**/node_modules/**' ':(glob)**/dist/**' ':(glob)**/build/**' \
            ':(glob)**/*.png' ':(glob)**/*.jpg' ':(glob)**/*.jpeg' ':(glob)**/*.gif' \
            ':(glob)**/*.ico' ':(glob)**/*.webp' ':(glob)**/*.woff*' ':(glob)**/*.ttf' \
            ':(glob)**/*.drawio' ':(glob)**/*.excalidraw' ':(glob)**/*.pdf' ':(glob)**/*.mp4' ':(glob)**/*.mp3'
      - name: Render Repo Visualizer map
        uses: githubocto/repo-visualizer@a999615bdab757559bf94bda1fe6eef232765f85
        with:
          root_path: .work/idle-arcade
          output_file: reports/repository/repo-visualizer.svg
          excluded_paths: .git,node_modules,dist,build,out,.next,package-lock.json,yarn.lock,pnpm-lock.yaml
          should_push: false
      - name: Render Repocarto map
        uses: aurelio-nakamura/repocarto@b1a8d6de32d9ef2e32c538be320e4588c7630212
        with:
          path: .work/idle-arcade
          output: reports/repository/repocarto.svg
          metric: loc
          size: '1600'
          title: IDLE Arcade
          version: '0.1.2'
          commit: 'false'
      - name: Install Gource rendering dependencies
        if: inputs.gource_preview == true
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gource xvfb xauth ffmpeg libgl1-mesa-dri
      - name: Capture experimental Gource still
        if: inputs.gource_preview == true
        run: bash scripts/gource-still.sh .work/game reports/repository
      - name: Publish repository image metadata and PNG copies
        run: node scripts/repository-report.ts .work/game
      - name: Commit changed reports
        shell: bash
        run: |
          git add -- reports/
          if git diff --cached --quiet; then
            echo 'Report content unchanged; no commit required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'reports: refresh project effort charts'
          # A concurrent human push causes a safe failure; never force-push stale reports.
          git push origin "HEAD:$DEFAULT_BRANCH"
      - name: Upload generated reports
        if: success() || failure()
        uses: actions/upload-artifact@v4
        with:
          name: effort-reports
          path: reports/
          if-no-files-found: ignore
          retention-days: 14
